# LiveKit Egress (room-composite recording) for H-SETS.
#
# The app calls startRoomCompositeEgress with an S3Upload pointed at the private
# R2 bucket, so R2 credentials live in the app's env — NOT here. This service
# only needs to reach the SFU and Redis.
log_level: info

# Must match the key pair in livekit.yaml.
api_key: APIchangeme
api_secret: changemechangemechangemechangemechangeme

# Internal address of the SFU. Plaintext over loopback is correct here — this
# never leaves the box, so it does not go through Caddy.
ws_url: ws://127.0.0.1:7880
insecure: true

redis:
  # MUST be the same Redis the SFU uses — that is how egress discovers rooms.
  address: 127.0.0.1:6379

# Scratch space while Chrome composites; the finished file uploads to R2.
tmp_dir: /tmp/egress

# Concurrent recordings this box will accept. Each room-composite egress runs a
# full headless Chrome: budget ~4 cores and ~2GB RAM per unit. Raising this past
# what the CPU supports produces corrupted recordings, not queued ones.
cpu_cost:
  room_composite_cpu_cost: 4
